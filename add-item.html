<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniShare - Add Item</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header id="site-header"></header>
<main>
<section><div class="container">
  <h1 class="section-title" style="text-align:center">Add an <span>Item</span></h1>
  <div id="loginNotice" class="msg" style="max-width:640px;margin:0 auto 15px"></div>
  <div class="form-box" id="addForm">
    <label for="itemName">Item name</label><input type="text" id="itemName">
    <label for="itemCategory">Category</label><select id="itemCategory"></select>
    <label for="itemType">Listing type</label>
    <select id="itemType" onchange="updateTypeFields()"><option value="">Select type</option><option>Donate</option><option>Rent</option><option>Sell</option></select>

    <div class="type-box" id="donateNotice" style="display:none"><p class="note">This item will be given away <b>free</b>. No selling or rental price needed.</p></div>
    <div class="type-box" id="rentFields" style="display:none">
      <label for="rentPrice">Rental price (৳)</label><input type="number" id="rentPrice" min="1">
      <label for="rentUnit">Per</label><select id="rentUnit"><option value="day">Day</option><option value="week">Week</option></select>
      <label for="minDuration">Minimum rental duration</label><input type="text" id="minDuration" placeholder="e.g. 2 days">
      <label for="deposit">Security deposit (optional, ৳)</label><input type="number" id="deposit" min="0">
    </div>
    <div class="type-box" id="sellFields" style="display:none">
      <label for="sellPrice">Selling price (৳)</label><input type="number" id="sellPrice" min="1">
    </div>

    <label for="itemDesc">Description</label><textarea id="itemDesc"></textarea>
    <label for="itemCondition">Condition</label>
    <select id="itemCondition"><option value="">Select condition</option><option>New</option><option>Like New</option><option>Used</option></select>
    <label for="itemImage">Item image (optional, max 500 KB)</label>
    <input type="file" id="itemImage" accept="image/*" onchange="previewImage()">
    <img id="imgPreview" class="preview" alt="Image preview" style="display:none">

    <label for="itemUniversity">University name</label><input type="text" id="itemUniversity">
    <label for="itemDept">Department</label><input type="text" id="itemDept">
    <label for="contactName">Contact name</label><input type="text" id="contactName">
    <p class="note">Give at least one contact method:</p>
    <label for="teamsId">Microsoft Teams ID or contact link</label><input type="text" id="teamsId">
    <label for="phone">Phone number</label><input type="text" id="phone">
    <label for="email">University email</label><input type="text" id="email">

    <div class="btn-row"><button class="btn" onclick="submitListing()">Submit Listing</button><button class="btn btn-dark" onclick="clearListingForm()">Clear Form</button></div>
    <p id="formMsg" class="msg"></p>
  </div>
</div></section>
</main>
<footer id="site-footer"></footer>
<script src="js/storage.js"></script>
<script src="js/main.js"></script>
<script src="js/add-item.js"></script>
<script>setupAddItem();</script>
</body>
</html>
